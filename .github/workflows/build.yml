name: Build profiles

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [claude-quint, claude-numina-lean, claude-esbmc]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.profile }}
        run: ./prover-agent build ${{ matrix.profile }}
